<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="فیکا">
  <title>فیکا چمپیون</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="auth" class="auth-wrap">
    <img class="logo-big" src="./icons/icon-512.png" alt="فیکا">
    <h2 class="center" style="margin:0 0 4px">فیکا چمپیون</h2>
    <p class="center muted" style="margin:0 0 18px">لیگ پیش‌بینی دوستانه ۲۶/۲۷</p>
    <div class="card">
      <h3 id="auth-title">ساخت حساب</h3>
      <p id="first-hint" class="tiny">اولین حساب، بدون دعوت، مدیر گروه می‌شود و دعوت‌های بعدی را می‌سازد.</p>
      <form id="auth-form" data-mode="reg">
        <div id="name-wrap">
          <label>نام نمایشی</label>
          <input id="displayName" autocomplete="nickname" maxlength="24" placeholder="برای جدول">
        </div>
        <label>ایمیل</label>
        <input id="email" type="email" autocomplete="username" required placeholder="برای ورود؛ یکتا">
        <label>رمز</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="حداقل ۸ کاراکتر">
        <div id="invite-wrap" class="hidden">
          <label>کد دعوت</label>
          <input id="inviteCode" autocomplete="off" placeholder="از نفر دوم به بعد لازم است">
        </div>
        <button class="btn" style="margin-top:16px" type="submit">ادامه</button>
      </form>
      <p class="center tiny" id="auth-switch" style="margin-top:14px"></p>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <div class="brand">
        <img src="./icons/icon-192.png" alt="">
        <div>
          <h1>فیکا چمپیون</h1>
          <small>فصل ۲۶/۲۷</small>
        </div>
      </div>
      <div class="user-chip" id="userchip"></div>
    </header>
    <main id="view"></main>
    <nav class="nav">
      <button data-page="matches" class="active"><span>⚽</span>بازی‌ها</button>
      <button data-page="table"><span>🏆</span>جدول</button>
      <button data-page="chat"><span>💬</span>گفتگو</button>
      <button data-page="more"><span>👤</span>بیشتر</button>
      <button data-page="admin" id="admin-nav" class="hidden"><span>⚙</span>مدیر</button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="./js/data.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
